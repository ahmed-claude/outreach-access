<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Outreach Engine · Ahmed X Marketing</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;background:#131517;color:#F7F7F6;font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 24px}
.k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#C79A4B;margin:0 0 12px;font-weight:600}
h1{font:700 32px/1.1 Archivo,Inter,system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 12px}
p{color:#8A9299;margin:0 0 12px}a{color:#F7F7F6}
</style></head>
<body><main><p class="k">Ahmed X Marketing</p><h1>Outreach Engine</h1>
<p id="status">Finding the engine&hellip;</p>
<noscript><p>Turn on JavaScript to continue.</p></noscript></main>
<script>
(function () {
  var status = document.getElementById('status');
  var base = location.pathname.replace(/\/(index\.html|404\.html)?$/, '');
  var repoRoot = '/' + (location.pathname.split('/')[1] || '');
  var rest = location.pathname.indexOf(repoRoot) === 0 ? location.pathname.slice(repoRoot.length) : '';
  if (/^\/(index\.html|404\.html)?$/.test(rest)) rest = '/';
  fetch(repoRoot + '/link.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.url) {
        status.textContent = 'Opening the engine\u2026';
        location.replace(d.url.replace(/\/$/, '') + rest + location.search + location.hash);
      } else {
        status.textContent = 'The engine is reconnecting. This page will try again in 30 seconds.';
        setTimeout(function () { location.reload(); }, 30000);
      }
    })
    .catch(function () {
      status.textContent = 'Could not reach the link list. Retrying in 30 seconds.';
      setTimeout(function () { location.reload(); }, 30000);
    });
})();
</script></body></html>
